services:
  airflow-postgres:
    image: postgres:17
    container_name: pladi-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    ports:
      - "${AIRFLOW_DB_PORT:-5433}:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build: .
    image: pladi-airflow:latest
    container_name: pladi-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: |
      bash -c "
      airflow db migrate
      echo '{\"admin\": \"admin\"}' > /opt/airflow/simple_auth_manager_passwords.json.generated
      airflow connections add minio_default --conn-type aws --conn-login pladi --conn-password pladi2024 --conn-extra '{\"endpoint_url\": \"http://minio:9000\"}'
      airflow connections add postgis_pladi --conn-type postgres --conn-host postgis --conn-port 5432 --conn-schema pladi --conn-login pladi --conn-password pladi
      echo '=== Init complete ==='
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - airflow_home_data:/opt/airflow

  airflow-webserver:
    image: pladi-airflow:latest
    container_name: pladi-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: api-server
    ports:
      - "${AIRFLOW_WS_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - airflow_home_data:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/api/v2/monitor/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    image: pladi-airflow:latest
    container_name: pladi-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - airflow_home_data:/opt/airflow
    restart: unless-stopped

volumes:
  airflow_postgres_data:
    driver: local
  airflow_home_data:
    driver: local
