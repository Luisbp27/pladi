services:
  airflow-postgres:
    image: postgres:17
    container_name: pladi-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:${AIRFLOW_DB_PORT:-5433}:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build: .
    image: pladi-airflow:latest
    container_name: pladi-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API__BASE_URL: http://airflow-webserver:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pladi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pladi2024}
      POSTGRES_USER: ${POSTGRES_USER:-pladi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pladi}
      POSTGRES_DB: ${POSTGRES_DB:-pladi}
    command: |
      bash -c "
      mkdir -p /opt/airflow/logs
      chown -R 50000:50000 /opt/airflow/logs
      airflow db migrate
      echo \"{\\\"${AIRFLOW_ADMIN_USER:-admin}\\\": \\\"${AIRFLOW_ADMIN_PASSWORD:-admin}\\\"}\" > /opt/airflow/simple_auth_manager_passwords.json.generated
      airflow connections add minio_default --conn-type aws --conn-login ${MINIO_ROOT_USER:-pladi} --conn-password ${MINIO_ROOT_PASSWORD:-pladi2024} --conn-extra \"{\\\"endpoint_url\\\": \\\"http://minio:9000\\\"}\"
      airflow connections add postgis_pladi --conn-type postgres --conn-host postgis --conn-port 5432 --conn-schema ${POSTGRES_DB:-pladi} --conn-login ${POSTGRES_USER:-pladi} --conn-password ${POSTGRES_PASSWORD:-pladi}
      echo '=== Init complete ==='
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ../../data:/opt/airflow/data:ro
      - ../../models:/opt/airflow/models:ro
      - airflow_home_data:/opt/airflow

  airflow-webserver:
    image: pladi-airflow:latest
    container_name: pladi-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_WS_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ../../data:/opt/airflow/data:ro
      - ../../models:/opt/airflow/models:ro
      - airflow_home_data:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/api/v2/monitor/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    image: pladi-airflow:latest
    container_name: pladi-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ../../data:/opt/airflow/data:ro
      - ../../models:/opt/airflow/models:ro
      - airflow_home_data:/opt/airflow
    restart: unless-stopped

  airflow-dag-processor:
    image: pladi-airflow:latest
    container_name: pladi-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ../../data:/opt/airflow/data:ro
      - ../../models:/opt/airflow/models:ro
      - airflow_home_data:/opt/airflow
    restart: unless-stopped

volumes:
  airflow_postgres_data:
    driver: local
  airflow_home_data:
    driver: local
