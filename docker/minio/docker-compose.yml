services:
  minio:
    image: minio/minio:latest
    container_name: pladi-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pladi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pladi2024}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
